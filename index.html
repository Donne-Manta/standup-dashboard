<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Standup Dashboard – Manta Sleep</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f1f5f9;color:#1e293b;min-height:100vh}
.topbar{background:white;border-bottom:1px solid #e2e8f0;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px}
.logo h1{font-size:17px;font-weight:700;color:#0f172a}
.logo .badge{background:#ede9fe;color:#6366f1;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px}
.topbar-right{display:flex;align-items:center;gap:8px}
.range-btns{display:flex;gap:4px}
.range-btn{padding:5px 11px;border-radius:6px;border:1px solid #e2e8f0;background:white;color:#64748b;cursor:pointer;font-size:12px;font-weight:500;transition:all .15s}
.range-btn:hover{border-color:#6366f1;color:#6366f1}
.range-btn.active{background:#6366f1;border-color:#6366f1;color:white}
.upload-btn{padding:5px 12px;border-radius:6px;border:1px solid #e2e8f0;background:white;color:#64748b;cursor:pointer;font-size:12px;font-weight:500;display:flex;align-items:center;gap:5px;transition:all .15s}
.upload-btn:hover{border-color:#6366f1;color:#6366f1}
.upload-btn.has-data{border-color:#16a34a;color:#16a34a}
.refresh-btn{padding:5px 11px;border-radius:6px;border:1px solid #e2e8f0;background:white;color:#64748b;cursor:pointer;font-size:12px;font-weight:500;display:flex;align-items:center;gap:5px;transition:all .15s}
.refresh-btn:hover{border-color:#6366f1;color:#6366f1}
.refresh-btn.spinning svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.page{padding:24px;max-width:1200px;margin:0 auto}
.status-bar{font-size:12px;color:#94a3b8;margin-bottom:18px;height:16px}
.tabs{display:flex;border-bottom:2px solid #e2e8f0;margin-bottom:20px}
.tab-btn{padding:9px 18px;border:none;background:none;cursor:pointer;font-size:14px;font-weight:500;color:#64748b;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab-btn:hover{color:#6366f1}
.tab-btn.active{color:#6366f1;border-bottom-color:#6366f1}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat-card{background:white;border-radius:12px;padding:16px;border:1px solid #e2e8f0}
.stat-label{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:8px}
.stat-value{font-size:28px;font-weight:700;color:#0f172a;line-height:1}
.stat-sub{font-size:12px;color:#94a3b8;margin-top:6px}
.charts-row{display:grid;grid-template-columns:3fr 2fr;gap:12px;margin-bottom:16px}
.chart-card{background:white;border-radius:12px;padding:16px;border:1px solid #e2e8f0}
.card-title{font-size:13px;font-weight:600;color:#334155;margin-bottom:14px}
.bottom-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.list-item{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f1f5f9;font-size:13px;color:#334155}
.list-item:last-child{border-bottom:none}
.badge-pill{background:#ede9fe;color:#6366f1;border-radius:12px;padding:2px 8px;font-size:11px;font-weight:600}
.alert-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f1f5f9;font-size:13px;color:#334155}
.alert-row:last-child{border-bottom:none}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-amber{background:#f59e0b}
.dot-red{background:#ef4444}
.insights-card{background:white;border-radius:12px;padding:16px;border:1px solid #e2e8f0;margin-bottom:16px}
.insights-body p{font-size:13px;line-height:1.7;color:#475569;margin-bottom:6px}
.ind-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.p-charts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.member-sel-row{margin-bottom:16px}
.member-sel-row select{padding:8px 14px;border-radius:8px;border:1px solid #e2e8f0;background:white;color:#1e293b;font-size:14px;min-width:240px;cursor:pointer}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;padding:8px 10px;border-bottom:2px solid #e2e8f0;color:#94a3b8;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.tbl td{padding:8px 10px;border-bottom:1px solid #f1f5f9;color:#334155;vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.pill{display:inline-flex;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.pill-great{background:#dcfce7;color:#15803d}
.pill-fine{background:#fef9c3;color:#a16207}
.pill-bad{background:#fee2e2;color:#dc2626}
.loading{display:flex;align-items:center;justify-content:center;min-height:300px;gap:10px;color:#94a3b8;font-size:14px}
.spin{width:18px;height:18px;border:2px solid #e2e8f0;border-top-color:#6366f1;border-radius:50%;animation:spin .7s linear infinite}
.err-box{background:#fee2e2;border-radius:10px;padding:16px;color:#dc2626;font-size:13px;margin-bottom:16px}
.great{color:#16a34a!important}
.fine{color:#d97706!important}
.bad{color:#dc2626!important}
.indigo{color:#6366f1!important}

.upload-
