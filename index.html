<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Standup Dashboard – Manta Sleep</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f1f5f9;color:#1e293b;min-height:100vh}
.topbar{background:white;border-bottom:1px solid #e2e8f0;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px}
.logo h1{font-size:17px;font-weight:700;color:#0f172a}
.logo .badge{background:#ede9fe;color:#6366f1;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px}
.topbar-right{display:flex;align-items:center;gap:8px}
.range-btns{display:flex;gap:4px}
.range-btn{padding:5px 11px;border-radius:6px;border:1px solid #e2e8f0;background:white;color:#64748b;cursor:pointer;font-size:12px;font-weight:500;transition:all .15s}
.range-btn:hover{border-color:#6366f1;color:#6366f1}
.range-btn.active{background:#6366f1;border-color:#6366f1;color:white}
.page{padding:24px;max-width:1200px;margin:0 auto}
.status-bar{font-size:13px;font-weight:500;color:#64748b;margin-bottom:18px;min-height:20px;padding:6px 12px;background:white;border-radius:6px;border:1px solid #e2e8f0;display:inline-block}
.tabs{display:flex;border-bottom:2px solid #e2e8f0;margin-bottom:20px}
.tab-btn{padding:9px 18px;border:none;background:none;cursor:pointer;font-size:14px;font-weight:500;color:#64748b;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab-btn:hover{color:#6366f1}
.tab-btn.active{color:#6366f1;border-bottom-color:#6366f1}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat-card{background:white;border-radius:12px;padding:16px;border:1px solid #e2e8f0}
.stat-label{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:8px}
.stat-value{font-size:28px;font-weight:700;color:#0f172a;line-height:1}
.stat-sub{font-size:12px;color:#94a3b8;margin-top:6px}
.charts-row{display:grid;grid-template-columns:3fr 2fr;gap:12px;margin-bottom:16px}
.chart-card{background:white;border-radius:12px;padding:16px;border:1px solid #e2e8f0}
.card-title{font-size:13px;font-weight:600;color:#334155;margin-bottom:14px}
.bottom-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.insights-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.list-item{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f1f5f9;font-size:12px;color:#334155}
.list-item:last-child{border-bottom:none}
.badge-pill{background:#ede9fe;color:#6366f1;border-radius:12px;padding:2px 8px;font-size:11px;font-weight:600}
.badge-pill.pill-green{background:#dcfce7;color:#15803d}
.badge-pill.pill-amber{background:#fef9c3;color:#a16207}
.badge-pill.pill-red{background:#fee2e2;color:#dc2626}
.alert-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f1f5f9;font-size:13px;color:#334155}
.alert-row:last-child{border-bottom:none}
.ind-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.p-charts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.member-sel-row{margin-bottom:16px}
.member-sel-row select{padding:8px 14px;border-radius:8px;border:1px solid #e2e8f0;background:white;color:#1e293b;font-size:14px;min-width:240px;cursor:pointer}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;padding:8px 10px;border-bottom:2px solid #e2e8f0;color:#94a3b8;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.tbl td{padding:8px 10px;border-bottom:1px solid #f1f5f9;color:#334155;vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.pill{display:inline-flex;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.pill-great{background:#dcfce7;color:#15803d}
.pill-fine{background:#fef9c3;color:#a16207}
.pill-bad{background:#fee2e2;color:#dc2626}
.err-box{background:#fee2e2;border-radius:10px;padding:16px;color:#dc2626;font-size:13px;margin-bottom:16px}
.great{color:#16a34a!important}
.fine{color:#d97706!important}
.bad{color:#dc2626!important}
.indigo{color:#6366f1!important}

@media(max-width:1024px){
  .stats-grid, .insights-row {grid-template-columns:1fr 1fr}
}
@media(max-width:768px){
  .stats-grid, .charts-row, .bottom-row, .p-charts, .insights-row {grid-template-columns:1fr}
  .ind-grid{grid-template-columns:1fr 1fr}
  .topbar{flex-wrap:wrap;height:auto;padding:10px 16px;gap:8px}
  .range-btns{flex-wrap:wrap}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <span style="font-size:22px">☀️</span>
    <h1>Daily Standup</h1>
    <span class="badge">Manta Sleep</span>
  </div>
  <div class="topbar-right">
    <div class="range-btns">
      <button class="range-btn" onclick="setRange('7d')">7 days</button>
      <button class="range-btn active" onclick="setRange('30d')">30 days</button>
      <button class="range-btn" onclick="setRange('90d')">90 days</button>
      <button class="range-btn" onclick="setRange('all')">All time</button>
    </div>
  </div>
</div>

<div class="page">
  <div class="status-bar" id="statusBar">⏳ Connecting to cloud spreadsheet configuration...</div>

  <div id="dashView" style="display:block">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('company')">Company</button>
      <button class="tab-btn" onclick="switchTab('individual')">Individual</button>
    </div>

    <div id="companyView"></div>

    <div id="individualView" style="display:none">
      <div class="member-sel-row">
        <select id="memberSel" onchange="renderIndividual(this.value)">
          <option value="">— Select a team member —</option>
        </select>
      </div>
      <div id="indContent"><div style="text-align:center;color:#94a3b8;padding:48px;font-size:14px">Select a team member to view their history.</div></div>
    </div>
  </div>
</div>

<script>
const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQRU8InZgxsb3djla0WksjC2ufbTlzxvGlPISn_olfaO195ZRb_3FEbVolNdh1Qvw/pub?gid=1668261615&single=true&output=csv";

const KNOWN_NAMES = ["Camille","Chloe Guo","Claudia Ibrahim","Daisy Huang","Dan Franklin","Dani Molina","Desiree Cagalitan-Olaso","Donné Norman","Erica Amaro","Erin Canoy-Yarisantos","Ethan Lott","Fem Bacerra","Gabbie Talan","Ibrahim Aleem","Ivy Pangilinan","James Swain","Judith","Julia Monteoliva","KJ Chang","Karleen Mae Guevara","Katalina Sanabria","Kristy Valencia","Laneza Rimando","Lee","Lia Fuentes","Marecris Soriano","Melanie van der Merwe","Merve Nur Sökmen","Nathan Tomlinson","Red","Sienna Paragas","Spencer Hung","Tomo","Vilécha Morton"];
const NAMES_BY_LEN = [...KNOWN_NAMES].sort((a,b) => b.length - a.length);

let allData = [];
let filtered = [];
let currentRange = "30d";
let currentTab = "company";

window.addEventListener("DOMContentLoaded", () => {
  if (!GOOGLE_SHEET_CSV_URL || GOOGLE_SHEET_CSV_URL.includes("PASTE_YOUR_LINK_HERE")) {
    document.getElementById("statusBar").textContent = "X Setup Incomplete: Please paste your live Google Sheets CSV link.";
    return;
  }
  fetchCloudData();
});

async function fetchCloudData() {
  try {
    const response = await fetch(GOOGLE_SHEET_CSV_URL);
    if (!response.ok) throw new Error("Could not fetch remote server configuration");
    const csvText = await response.text();
    
    const parsed = Papa.parse(csvText, {
      header: true,
      skipEmptyLines: true,
      transformHeader: h => h.trim()
    });
    
    if (!parsed.data.length) {
      document.getElementById("statusBar").textContent = "X Error: Google Sheets connected but zero matrix rows returned.";
      return;
    }
    
    loadRows(parsed.data, "Live Google Sheet");
  } catch (err) {
    document.getElementById("statusBar").textContent = "Please push this build to Vercel to bypass local file browser blocks.";
  }
}

function cleanName(raw) {
  raw = (raw || "").trim();
  if (!raw) return raw;
  if (KNOWN_NAMES.includes(raw)) return raw;
  for (const n of NAMES_BY_LEN) { if (raw.endsWith(n)) return n; }
  return raw;
}

// Fixed metric formatting engines
function parseFeel(raw) {
  const f = (raw || "").toLowerCase();
  if (f.includes("not good") || f.includes("red_circle") || f.includes("cranky")) return "Not good";
  if (f.includes("great") || f.includes("sunshine") || f.includes("kiwi")) return "Great";
  return "Fine";
}

function parseSleep(raw) {
  const m = (raw || "").match(/(\d+(?:\.\d+)?)/);
  if (!m) return null;
  let v = parseFloat(m[1]);
  if (v > 10) v /= 10;
  if (v > 10) return null;
  return Math.round(v * 10) / 10;
}

function getFlexibleField(row, targets) {
  for (let key in row) {
    let cleanKey = key.toLowerCase().replace(/[^a-z0-9]/g, "");
    for (let target of targets) {
      if (cleanKey.includes(target)) return row[key];
    }
  }
  return "";
}

function parseDate(raw) {
  if (!raw) return null;
  raw = raw.toString().trim();

  // 1. Handle native Excel/Google Sheet serial numbers (e.g., 45231)
  if (/^\d{5}$/.test(raw)) {
    const excelEpoch = new Date(Date.UTC(1899, 11, 30));
    const days = parseInt(raw, 10);
    const convertedDate = new Date(excelEpoch.getTime() + days * 24 * 60 * 60 * 1000);
    return convertedDate.toISOString().slice(0, 10);
  }

  // 2. Already clean ISO standard format (YYYY-MM-DD)
  if (/^\d{4}-\d{2}-\d{2}/.test(raw)) return raw.slice(0, 10);

  // 3. Leverage native browser parsing FIRST (handles text timestamps and standard Google Sheets formats flawlessly)
  const d = new Date(raw);
  if (!isNaN(d.getTime())) {
    return d.toISOString().slice(0, 10);
  }

  // 4. Manual fallback split for standard slash/dash formats if native engine misses it
  const p = raw.split(/[-/.]/);
  if (p.length === 3) {
    let [v1, v2, v3] = p;
    if (v3.length === 4) {
      let day = parseInt(v1, 10);
      let month = parseInt(v2, 10);
      
      if (day > 12 && month <= 12) {
        return v3 + "-" + v2.padStart(2, "0") + "-" + v1.padStart(2, "0"); // DD/MM/YYYY
      } else if (month > 12 && day <= 12) {
        return v3 + "-" + v1.padStart(2, "0") + "-" + v2.padStart(2, "0"); // MM/DD/YYYY
      }
      // Default to American standard formatting if ambiguous (like 02/08/2026 for Feb 8th)
      return v3 + "-" + v1.padStart(2, "0") + "-" + v2.padStart(2, "0");
    }
  }
  return null;
}

function avg(arr) {
  const v = arr.filter(x => x != null);
  return v.length ? v.reduce((a,b) => a+b, 0) / v.length : null;
}

function fmt(n, dp=1) { return n != null ? n.toFixed(dp) : "—"; }
function moodScore(f) { return f === "Great" ? 3 : f === "Fine" ? 2 : 1; }
function moodEmoji(f) { return f === "Great" ? "🟢 Great" : f === "Fine" ? "🟡 Fine" : "🔴 Not good"; }
function moodCls(f) { return f === "Great" ? "great" : f === "Fine" ? "fine" : "bad"; }
function pillCls(f) { return f === "Great" ? "pill-great" : f === "Fine" ? "pill-fine" : "pill-bad"; }
function getMon(ds) {
  const d = new Date(ds + "T00:00:00"), day = d.getDay() || 7;
  return new Date(d - (day-1)*86400000).toISOString().slice(0,10);
}
function dc(id) { const c = Chart.getChart(id); if (c) c.destroy(); }

function getAppreciated(data) {
  const lk = {};
  for (const n of KNOWN_NAMES) {
    lk[n.toLowerCase()] = n;
    const first = n.split(" ")[0].toLowerCase();
    if (first.length >= 3) lk[first] = n;
  }
  Object.assign(lk, { "donne":"Donné Norman","donné":"Donné Norman","des":"Desiree Cagalitan-Olaso","vilecha":"Vilécha Morton","kj":"KJ Chang","kat":"Katalina Sanabria" });
  const cnt = {};
  for (const e of data) {
    if (!e.g) continue;
    for (const [k, full] of Object.entries(lk)) {
      if (k.length < 2 || full === e.n) continue;
      if (new RegExp("\\b" + k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "\\b","i").test(e.g))
        cnt[full] = (cnt[full] || 0) + 1;
    }
  }
  return Object.entries(cnt).sort((a,b) => b[1]-a[1]).slice(0,8);
}

function getTopThreeMonthlyInsights(data) {
  const months = {};
  const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  data.forEach(e => {
    if (!e.d) return;
    const yearMonth = e.d.slice(0, 7);
    if (!months[yearMonth]) {
      months[yearMonth] = { moodScores: [], sleepScores: [] };
    }
    months[yearMonth].moodScores.push(moodScore(e.f));
    if (e.s != null) months[yearMonth].sleepScores.push(e.s);
  });

  const summary = [];
  for (const [ym, obj] of Object.entries(months)) {
    const year = ym.split("-")[0];
    const monthIdx = parseInt(ym.split("-")[1], 10) - 1;
    const label = monthNames[monthIdx] + " " + year;
    summary.push({
      label: label,
      avgMood: avg(obj.moodScores),
      avgSleep: avg(obj.sleepScores)
    });
  }

  const result = { highestMood: [], lowestMood: [], highestSleep: [], lowestSleep: [] };
  if (!summary.length) return result;

  const validMoods = summary.filter(m => m.avgMood !== null);
  if (validMoods.length) {
    validMoods.sort((a, b) => b.avgMood - a.avgMood);
    result.highestMood = validMoods.slice(0, 3);
    const lowMoods = [...validMoods].sort((a, b) => a.avgMood - b.avgMood);
    result.lowestMood = lowMoods.slice(0, 3);
  }

  const validSleep = summary.filter(m => m.avgSleep !== null);
  if (validSleep.length) {
    validSleep.sort((a, b) => b.avgSleep - a.avgSleep);
    result.highestSleep = validSleep.slice(0, 3);
    const lowSleep = [...validSleep].sort((a, b) => a.avgSleep - b.avgSleep);
    result.lowestSleep = lowSleep.slice(0, 3);
  }

  return result;
}

// Custom Mathematical filter parsing for flagging at-risk individuals
function getAtRiskTeamMembers(data, rangeMode) {
  const memberMap = {};
  
  data.forEach(e => {
    if (!e.n) return;
    if (!memberMap[e.n]) {
      memberMap[e.n] = { moods: [], sleeps: [] };
    }
    memberMap[e.n].moods.push(moodScore(e.f));
    if (e.s != null) memberMap[e.n].sleeps.push(e.s);
  });

  // Pick adaptive threshold metrics based on the top bar selection state
  const moodLimit  = (rangeMode === "7d") ? 2.0 : 2.3;
  const sleepLimit = (rangeMode === "7d") ? 5.0 : 5.5;

  const atRiskList = [];
  for (const [name, obj] of Object.entries(memberMap)) {
    const userMoodAvg = avg(obj.moods);
    const userSleepAvg = avg(obj.sleeps);

    // Trigger flag condition if mood OR sleep falls below parameters
    const isMoodAtRisk = (userMoodAvg !== null && userMoodAvg <= moodLimit);
    const isSleepAtRisk = (userSleepAvg !== null && userSleepAvg <= sleepLimit);

    if (isMoodAtRisk || isSleepAtRisk) {
      atRiskList.push({
        name: name,
        mood: userMoodAvg,
        sleep: userSleepAvg,
        reasonMood: isMoodAtRisk,
        reasonSleep: isSleepAtRisk
      });
    }
  }

  // Sort by lowest mood average first
  return atRiskList.sort((a, b) => (a.mood || 3) - (b.mood || 3));
}

function loadRows(rows, filename) {
  allData = rows
    .map(row => {
      const name = cleanName(getFlexibleField(row, ["name", "member", "person"]));
      const date = parseDate(getFlexibleField(row, ["date", "timestamp", "submitted"]));
      const feeling = parseFeel(getFlexibleField(row, ["feeling", "mood", "howareyou", "status"]));
      const sleep = parseSleep(getFlexibleField(row, ["sleep", "hours"]));
      const gratitude = (getFlexibleField(row, ["gratitude", "notes", "shoutout", "appreciation"])).toString().trim().slice(0, 400);
      return { n: name, d: date, f: feeling, s: sleep, g: gratitude };
    })
    .filter(r => r.n && r.d);

  allData.sort((a,b) => a.d.localeCompare(b.d));

  if (!allData.length) {
    document.getElementById("statusBar").textContent = "X Structure Fault: Found document but columns are mapped incorrectly.";
    return;
  }

  const names = [...new Set(allData.map(e => e.n))].sort();
  const sel = document.getElementById("memberSel");
  sel.innerHTML = '<option value="">— Select a team member —</option>';
  for (const n of names) {
    const o = document.createElement("option");
    o.value = n; o.textContent = n;
    sel.appendChild(o);
  }
  applyFilter();
}

function setRange(r) {
  currentRange = r;
  document.querySelectorAll(".range-btn").forEach((b,i) =>
    b.classList.toggle("active", ["7d","30d","90d","all"][i] === r));
  applyFilter();
}

function applyFilter() {
  const days = { "7d":7, "30d":30, "90d":90 }[currentRange];
  const cut = days ? new Date(Date.now() - days * 86400000).toISOString().slice(0,10) : "2000-01-01";
  filtered = allData.filter(e => e.d >= cut);
  renderTab();
}

function renderTab() {
  if (currentTab === "company") renderCompany(filtered);
  else {
    const sel = document.getElementById("memberSel");
    if (sel.value) renderIndividual(sel.value);
  }
}

document.addEventListener("click", function(e) {
  if (e.target && e.target.classList.contains("tab-btn")) {
    let targetTab = e.target.getAttribute("onclick").match(/'([^']+)'/)[1];
    switchTab(targetTab);
  }
});

function switchTab(t) {
  currentTab = t;
  document.querySelectorAll(".tab-btn").forEach((b,i) =>
    b.classList.toggle("active", i === (t === "company" ? 0 : 1)));
  document.getElementById("companyView").style.display = t === "company" ? "block" : "none";
  document.getElementById("individualView").style.display = t === "individual" ? "block" : "none";
  if (t === "company") renderCompany(filtered);
}

function renderCompany(data) {
  if (!data.length) {
    document.getElementById("companyView").innerHTML = '<div class="err-box">No data found for this date range.</div>';
    return;
  }
  const names = [...new Set(allData.map(e => e.n))].sort();
  const total = data.length;
  const great = data.filter(e => e.f === "Great").length;
  const fine  = data.filter(e => e.f === "Fine").length;
  const bad   = data.filter(e => e.f === "Not good").length;
  const slAvg = avg(data.filter(e => e.s != null).map(e => e.s));
  const days  = [...new Set(data.map(e => e.d))];
  const rate  = days.length ? Math.round(total / (days.length * names.length) * 100) : 0;
  const dom   = great >= fine && great >= bad ? "Great" : fine >= bad ? "Fine" : "Not good";
  const rateCol = rate >= 80 ? "#16a34a" : rate >= 60 ? "#d97706" : "#dc2626";
  const wkMap = {};
  for (const e of data) {
    const w = getMon(e.d);
    if (!wkMap[w]) wkMap[w] = { great:0, fine:0, bad:0, sl:[], cnt:0 };
    if (e.f === "Great") wkMap[w].great++;
    else if (e.f === "Fine") wkMap[w].fine++;
    else wkMap[w].bad++;
    if (e.s != null) wkMap[w].sl.push(e.s);
    wkMap[w].cnt++;
  }
  const wks = Object.keys(wkMap).sort().slice(-12);
  const last5 = [...days].sort().reverse().slice(0, 5);
  const recent = new Set(data.filter(e => last5.includes(e.d)).map(e => e.n));
  const absent = names.filter(n => !recent.has(n));
  const appr = getAppreciated(data);
  
  const monthly = getTopThreeMonthlyInsights(data);
  
  // Isolate flagged at risk individuals
  const atRiskMembers = getAtRiskTeamMembers(data, currentRange);

  document.getElementById("companyView").innerHTML = `
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Submissions</div>
        <div class="stat-value">${total.toLocaleString()}</div>
        <div class="stat-sub">${days.length} days . ${names.length} members</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Dominant Mood</div>
        <div class="stat-value ${moodCls(dom)}" style="font-size:19px">${moodEmoji(dom)}</div>
        <div class="stat-sub">🟢 ${great} &nbsp;&nbsp; 🟡 ${fine} &nbsp;&nbsp; 🔴 ${bad}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Avg Sleep Score</div>
        <div class="stat-value indigo">${fmt(slAvg)}<span style="font-size:15px;color:#94a3b8">/10</span></div>
        <div class="stat-sub">${data.filter(e=>e.s!=null).length} scores recorded</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Participation Rate</div>
        <div class="stat-value" style="color:${rateCol}">${rate}%</div>
        <div class="stat-sub">avg submissions/member/day</div>
      </div>
    </div>
    
    <div class="charts-row">
      <div class="chart-card">
        <div class="card-title">Team Mood by Week</div>
        <canvas id="moodC" height="120"></canvas>
      </div>
      <div class="chart-card">
        <div class="card-title">Avg Sleep Score by Week</div>
        <canvas id="sleepC" height="120"></canvas>
      </div>
    </div>
    
    <div class="bottom-row">
      <div class="chart-card">
        <div class="card-title">💛 Most Appreciated</div>
        ${appr.length
          ? `<ul>${appr.map(([n,c],i) => `<li class="list-item"><span>${["🏆","🥈","🥉"][i]||""} ${n}</span><span class="badge-pill">${c} mentions</span></li>`).join("")}</ul>`
          : `<p style="color:#94a3b8;font-size:13px;padding:12px 0">No data in this range.</p>`}
      </div>
      <div class="chart-card">
        <div class="card-title">⚠️ Haven't Submitted Recently</div>
        ${absent.length === 0
          ? `<p style="color:#16a34a;font-size:13px;padding:12px 0">Everyone submitted recently!</p>`
          : `<ul>${absent.slice(0,10).map(n => `<li class="alert-row"><span class="dot-amber"></span>${n}</li>`).join("")}</ul>`}
      </div>
    </div>

    <div class="card-title" style="margin: 24px 0 12px 4px; font-size:14px; font-weight:700;">📊 Insights</div>
    <div class="insights-row">
      <div class="chart-card">
        <div class="stat-label" style="margin-bottom:12px;">Months with the highest mood</div>
        <ul>
          ${monthly.highestMood.length ? monthly.highestMood.map((m,i) => `
            <li class="list-item">
              <span style="font-weight:600; color:#16a34a;">${i+1}. 🟢 ${m.label}</span>
              <span class="badge-pill pill-green">${fmt(m.avgMood)}/3</span>
            </li>`).join("") : '<li style="color:#94a3b8; font-size:12px;">—</li>'}
        </ul>
      </div>
      <div class="chart-card">
        <div class="stat-label" style="margin-bottom:12px;">Months with the lowest mood</div>
        <ul>
          ${monthly.lowestMood.length ? monthly.lowestMood.map((m,i) => `
            <li class="list-item">
              <span style="font-weight:600; color:#dc2626;">${i+1}. 🔴 ${m.label}</span>
              <span class="badge-pill pill-red">${fmt(m.avgMood)}/3</span>
            </li>`).join("") : '<li style="color:#94a3b8; font-size:12px;">—</li>'}
        </ul>
      </div>
      <div class="chart-card">
        <div class="stat-label" style="margin-bottom:12px;">Months with the highest sleep</div>
        <ul>
          ${monthly.highestSleep.length ? monthly.highestSleep.map((m,i) => `
            <li class="list-item">
              <span style="font-weight:600; color:#6366f1;">${i+1}. 🌙 ${m.label}</span>
              <span class="badge-pill pill-amber" style="background:#e0e7ff; color:#4338ca;">${fmt(m.avgSleep)}/10</span>
            </li>`).join("") : '<li style="color:#94a3b8; font-size:12px;">—</li>'}
        </ul>
      </div>
      <div class="chart-card">
        <div class="stat-label" style="margin-bottom:12px;">Months with the lowest sleep</div>
        <ul>
          ${monthly.lowestSleep.length ? monthly.lowestSleep.map((m,i) => `
            <li class="list-item">
              <span style="font-weight:600; color:#d97706;">${i+1}. ⚠️ ${m.label}</span>
              <span class="badge-pill pill-amber">${fmt(m.avgSleep)}/10</span>
            </li>`).join("") : '<li style="color:#94a3b8; font-size:12px;">—</li>'}
        </ul>
      </div>
    </div>

    <div class="card-title" style="margin: 24px 0 12px 4px; font-size:14px; font-weight:700;">🚨 At Risk Team Members (${currentRange === '7d' ? '7d limits' : 'Global limits'})</div>
    <div class="chart-card" style="margin-bottom: 24px;">
      ${atRiskMembers.length === 0 
        ? `<p style="color:#16a34a; font-size:13px; padding:12px 0; text-align:center; font-weight:500;">🎉 Excellent! No team members currently score below safety thresholds for this timeframe.</p>` 
        : `
        <table class="tbl" style="width:100%;">
          <thead>
            <tr>
              <th style="width:30%;">Team Member</th>
              <th style="width:35%;">Avg Mood Score</th>
              <th style="width:35%;">Avg Sleep Score</th>
            </tr>
          </thead>
          <tbody>
            ${atRiskMembers.map(m => `
              <tr>
                <td style="font-weight:700; padding:12px 10px; color:#0f172a;">${m.name}</td>
                <td style="padding:12px 10px;">
                  <span class="pill ${m.mood >= 2.5 ? 'pill-great' : m.mood >= 1.8 ? 'pill-fine' : 'pill-bad'}" style="${m.reasonMood ? 'border: 2px solid #dc2626; font-weight:800;' : ''}">
                    ${fmt(m.mood)} / 3.0 ${m.reasonMood ? ' ⚠️' : ''}
                  </span>
                </td>
                <td style="padding:12px 10px;">
                  <span class="pill ${m.sleep >= 7.5 ? 'pill-great' : m.sleep >= 5.6 ? 'pill-fine' : 'pill-bad'}" style="${m.reasonSleep ? 'border: 2px solid #dc2626; font-weight:800;' : ''}">
                    ${fmt(m.sleep)} / 10.0 ${m.reasonSleep ? ' ⚠️' : ''}
                  </span>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>`
      }
    </div>`;

  dc("moodC");
  new Chart(document.getElementById("moodC"), {
    type: "bar",
    data: {
      labels: wks.map(w => w.slice(5)),
      datasets: [
        { label:"Great", data: wks.map(w=>wkMap[w].great), backgroundColor:"#86efac" },
        { label:"Fine",  data: wks.map(w=>wkMap[w].fine),  backgroundColor:"#fde68a" },
        { label:"Not good", data: wks.map(w=>wkMap[w].bad), backgroundColor:"#fca5a5" }
      ]
    },
    options: { responsive:true, maintainAspectRatio:true, plugins:{legend:{labels:{color:"#64748b",boxWidth:12,font:{size:11}}}}, scales:{x:{stacked:true,ticks:{color:"#94a3b8",font:{size:10}},grid:{display:false}},y:{stacked:true,ticks:{color:"#94a3b8",font:{size:10}},grid:{color:"#f1f5f9"}}} }
  });

  dc("sleepC");
  new Chart(document.getElementById("sleepC"), {
    type: "line",
    data: {
      labels: wks.map(w => w.slice(5)),
      datasets: [{ data: wks.map(w => { const v = avg(wkMap[w].sl); return v != null ? parseFloat(v.toFixed(1)) : null; }), borderColor:"#6366f1", backgroundColor:"rgba(99,102,241,0.08)", pointBackgroundColor:"#6366f1", tension:0.3, fill:true, spanGaps:true, pointRadius:4 }]
    },
    options: { responsive:true, maintainAspectRatio:true, plugins:{legend:{display:false}}, scales:{x:{ticks:{color:"#94a3b8",font:{size:10}},grid:{display:false}},y:{min:4,max:10,ticks:{color:"#94a3b8",font:{size:10}},grid:{color:"#f1f5f9"}}} }
  });

  document.getElementById("statusBar").textContent = "✅ Connected · Analytics metrics compiled dynamically.";
}

// ─── Individual view ──────────────────────────────────────
function renderIndividual(name) {
  if (!name) return;
  const pd = filtered.filter(e => e.n === name).sort((a,b) => a.d.localeCompare(b.d));
  if (!pd.length) {
    document.getElementById("indContent").innerHTML = '<div style="color:#94a3b8;font-size:13px;padding:24px">No data logged for ' + name + ' during this specific time range. Try selecting a broader timeframe like "90 days" or "All time".</div>';
    return;
  }
  const slAvg = avg(pd.filter(e => e.s != null).map(e => e.s));
  const mAvg  = avg(pd.map(e => moodScore(e.f)));
  const dom   = mAvg >= 2.5 ? "Great" : mAvg >= 1.5 ? "Fine" : "Not good";
  const udates = [...new Set(pd.map(e => e.d))].sort().reverse();
  let streak = 0;
  for (let i = 0; i < udates.length; i++) {
    if (i === 0) { streak = 1; continue; }
    const diff = Math.round((new Date(udates[i-1]+"T00:00:00") - new Date(udates[i]+"T00:00:00")) / 86400000);
    if (diff <= 3) streak++; else break;
  }
  document.getElementById("indContent").innerHTML = `
    <div class="ind-grid">
      <div class="stat-card"><div class="stat-label">Total Submissions</div><div class="stat-value">${pd.length}</div><div class="stat-sub">${streak}-day streak</div></div>
      <div class="stat-card"><div class="stat-label">Overall Mood</div><div class="stat-value ${moodCls(dom)}" style="font-size:18px">${moodEmoji(dom)}</div><div class="stat-sub">avg ${fmt(mAvg)} / 3.0</div></div>
      <div class="stat-card"><div class="stat-label">Avg Sleep</div><div class="stat-value indigo" style="font-size:26px">${fmt(slAvg)}<span style="font-size:14px;color:#94a3b8">/10</span></div></div>
    </div>
    <div class="p-charts">
      <div class="chart-card"><div class="card-title">Mood Trend (Selected Range)</div><canvas id="pMood" height="140"></canvas></div>
      <div class="chart-card"><div class="card-title">Sleep Trend (Selected Range)</div><canvas id="pSleep" height="140"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Recent Entries</div>
      <table class="tbl">
        <thead><tr><th>Date</th><th>Mood</th><th>Sleep</th><th>Gratitude</th></tr></thead>
        <tbody>${[...pd].reverse().slice(0,20).map(e => `
          <tr>
            <td>${e.d.slice(5)}</td>
            <td><span class="pill ${pillCls(e.f)}">${e.f}</span></td>
            <td>${e.s != null ? fmt(e.s) : "—"}</td>
            <td style="max-width:300px; word-wrap:break-word;">${e.g || "—"}</td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>`;

  const cd = pd.slice(-30);
  dc("pMood");
  new Chart(document.getElementById("pMood"), {
    type: "bar",
    data: {
      labels: cd.map(e => e.d.slice(5)),
      datasets: [{
        label: "Mood Score",
        data: cd.map(e => moodScore(e.f)),
        backgroundColor: cd.map(e => e.f === "Great" ? "#86efac" : e.f === "Fine" ? "#fde68a" : "#fca5a5")
      }]
    },
    options: { 
      responsive: true, 
      maintainAspectRatio: true,
      plugins: { legend: { display: false } },
      scales: { 
        y: { min: 1, max: 3, ticks: { stepSize: 1, callback: function(v){ return v===3?"Great":v===2?"Fine":"Bad"; } } },
        x: { ticks: { font: { size: 9 } } }
      } 
    }
  });

  dc("pSleep");
  new Chart(document.getElementById("pSleep"), {
    type: "line",
    data: {
      labels: cd.map(e => e.d.slice(5)),
      datasets: [{
        data: cd.map(e => e.s),
        borderColor: "#6366f1",
        backgroundColor: "rgba(99,102,241,0.05)",
        tension: 0.2,
        fill: true,
        spanGaps: true
      }]
    },
    options: { 
      responsive: true, 
      maintainAspectRatio: true,
      plugins: { legend: { display: false } },
      scales: { y: { min: 4, max: 10 } } 
    }
  });
}
</script>
