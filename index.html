<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Standup Dashboard – Manta Sleep</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f1f5f9;color:#1e293b;min-height:100vh}
.topbar{background:white;border-bottom:1px solid #e2e8f0;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px}
.logo h1{font-size:17px;font-weight:700;color:#0f172a}
.logo .badge{background:#ede9fe;color:#6366f1;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px}
.topbar-right{display:flex;align-items:center;gap:10px}
.range-btns{display:flex;gap:4px}
.range-btn{padding:5px 11px;border-radius:6px;border:1px solid #e2e8f0;background:white;color:#64748b;cursor:pointer;font-size:12px;font-weight:500;transition:all .15s}
.range-btn:hover{border-color:#6366f1;color:#6366f1}
.range-btn.active{background:#6366f1;border-color:#6366f1;color:white}
.refresh-btn{padding:5px 11px;border-radius:6px;border:1px solid #e2e8f0;background:white;color:#64748b;cursor:pointer;font-size:12px;font-weight:500;display:flex;align-items:center;gap:5px;transition:all .15s}
.refresh-btn:hover{border-color:#6366f1;color:#6366f1}
.refresh-btn.spinning svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.page{padding:24px;max-width:1200px;margin:0 auto}
.status-bar{font-size:12px;color:#94a3b8;margin-bottom:18px;height:16px}
.tabs{display:flex;border-bottom:2px solid #e2e8f0;margin-bottom:20px}
.tab-btn{padding:9px 18px;border:none;background:none;cursor:pointer;font-size:14px;font-weight:500;color:#64748b;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab-btn:hover{color:#6366f1}
.tab-btn.active{color:#6366f1;border-bottom-color:#6366f1}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat-card{background:white;border-radius:12px;padding:16px;border:1px solid #e2e8f0}
.stat-label{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:8px}
.stat-value{font-size:28px;font-weight:700;color:#0f172a;line-height:1}
.stat-sub{font-size:12px;color:#94a3b8;margin-top:6px}
.charts-row{display:grid;grid-template-columns:3fr 2fr;gap:12px;margin-bottom:16px}
.chart-card{background:white;border-radius:12px;padding:16px;border:1px solid #e2e8f0}
.card-title{font-size:13px;font-weight:600;color:#334155;margin-bottom:14px}
.bottom-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.list-item{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f1f5f9;font-size:13px;color:#334155}
.list-item:last-child{border-bottom:none}
.badge-pill{background:#ede9fe;color:#6366f1;border-radius:12px;padding:2px 8px;font-size:11px;font-weight:600}
.alert-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f1f5f9;font-size:13px;color:#334155}
.alert-row:last-child{border-bottom:none}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-amber{background:#f59e0b}
.dot-red{background:#ef4444}
.insights-card{background:white;border-radius:12px;padding:16px;border:1px solid #e2e8f0;margin-bottom:16px}
.insights-body p{font-size:13px;line-height:1.7;color:#475569;margin-bottom:6px}
.ind-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.p-charts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.member-sel-row{margin-bottom:16px}
.member-sel-row select{padding:8px 14px;border-radius:8px;border:1px solid #e2e8f0;background:white;color:#1e293b;font-size:14px;min-width:240px;cursor:pointer}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;padding:8px 10px;border-bottom:2px solid #e2e8f0;color:#94a3b8;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.tbl td{padding:8px 10px;border-bottom:1px solid #f1f5f9;color:#334155;vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.pill{display:inline-flex;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.pill-great{background:#dcfce7;color:#15803d}
.pill-fine{background:#fef9c3;color:#a16207}
.pill-bad{background:#fee2e2;color:#dc2626}
.loading{display:flex;align-items:center;justify-content:center;min-height:300px;gap:10px;color:#94a3b8;font-size:14px}
.spin{width:18px;height:18px;border:2px solid #e2e8f0;border-top-color:#6366f1;border-radius:50%;animation:spin .7s linear infinite}
.err-box{background:#fee2e2;border-radius:10px;padding:16px;color:#dc2626;font-size:13px;margin-bottom:16px}
.great{color:#16a34a!important}
.fine{color:#d97706!important}
.bad{color:#dc2626!important}
.indigo{color:#6366f1!important}
/* Grok AI panel */
.ai-btn{padding:5px 12px;border-radius:6px;border:1px solid #a855f7;background:white;color:#a855f7;cursor:pointer;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;transition:all .15s}
.ai-btn:hover{background:#a855f7;color:white}
.ai-btn:disabled{opacity:.5;cursor:not-allowed}
.ai-btn.loading-ai{background:#f5f3ff;color:#a855f7;border-color:#c4b5fd}
.grok-panel{background:#faf5ff;border:1px solid #e9d5ff;border-radius:10px;padding:12px 14px;margin-bottom:14px;display:none}
.grok-panel.visible{display:block}
.grok-panel-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.grok-panel input{flex:1;padding:7px 12px;border-radius:6px;border:1px solid #d8b4fe;background:white;font-size:12px;color:#1e293b;outline:none}
.grok-panel input:focus{border-color:#a855f7}
.grok-panel .gen-btn{padding:7px 14px;border-radius:6px;border:none;background:#a855f7;color:white;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.grok-panel .gen-btn:hover{background:#9333ea}
.grok-panel .gen-btn:disabled{opacity:.5;cursor:not-allowed}
.grok-hint{font-size:11px;color:#a78bfa}
.ai-result{font-size:13px;line-height:1.75;color:#475569;border-top:1px solid #e9d5ff;padding-top:12px;margin-top:4px;white-space:pre-wrap}
.ai-result strong{color:#7c3aed}
.ai-spin{width:14px;height:14px;border:2px solid #e9d5ff;border-top-color:#a855f7;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@media(max-width:768px){
  .stats-grid{grid-template-columns:1fr 1fr}
  .charts-row,.bottom-row,.p-charts{grid-template-columns:1fr}
  .ind-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <span style="font-size:22px">☀️</span>
    <h1>Daily Standup</h1>
    <span class="badge">Manta Sleep</span>
  </div>
  <div class="topbar-right">
    <div class="range-btns">
      <button class="range-btn" onclick="setRange('7d')">7 days</button>
      <button class="range-btn active" onclick="setRange('30d')">30 days</button>
      <button class="range-btn" onclick="setRange('90d')">90 days</button>
      <button class="range-btn" onclick="setRange('all')">All time</button>
    </div>
    <button class="refresh-btn" id="refreshBtn" onclick="loadData()">
      <svg id="refreshIcon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      Refresh
    </button>
  </div>
</div>

<div class="page">
  <div class="status-bar" id="statusBar">Loading standup data…</div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('company')">Company</button>
    <button class="tab-btn" onclick="switchTab('individual')">Individual</button>
  </div>

  <div id="companyView">
    <div class="loading"><div class="spin"></div>Fetching from Google Sheets…</div>
  </div>

  <div id="individualView" style="display:none">
    <div class="member-sel-row">
      <select id="memberSel" onchange="renderIndividual(this.value)">
        <option value="">— Select a team member —</option>
      </select>
    </div>
    <div id="indContent"><div style="text-align:center;color:#94a3b8;padding:48px;font-size:14px">Select a team member to view their history.</div></div>
  </div>
</div>

<script>
// ─── Constants ────────────────────────────────────────────
const KNOWN_NAMES = ["Camille","Chloe Guo","Claudia Ibrahim","Daisy Huang","Dan Franklin","Dani Molina","Desiree Cagalitan-Olaso","Donné Norman","Erica Amaro","Erin Canoy-Yarisantos","Ethan Lott","Fem Bacerra","Gabbie Talan","Ibrahim Aleem","Ivy Pangilinan","James Swain","Judith","Julia Monteoliva","KJ Chang","Karleen Mae Guevara","Katalina Sanabria","Kristy Valencia","Laneza Rimando","Lee","Lia Fuentes","Marecris Soriano","Melanie van der Merwe","Merve Nur Sökmen","Nathan Tomlinson","Red","Sienna Paragas","Spencer Hung","Tomo","Vilécha Morton"];
const NAMES_BY_LEN = [...KNOWN_NAMES].sort((a,b) => b.length - a.length);

// Google Sheet ID — update if the sheet changes
const SHEET_ID = "1fMEwVzO_hufFx5RtJGPxauRsjCEvlt65";
const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;
// Free CORS proxy fallback (no account needed, no credits)
const PROXY_URL = `https://corsproxy.io/?url=${encodeURIComponent(SHEET_URL)}`;

// ─── State ────────────────────────────────────────────────
let allData = [];
let filtered = [];
let currentRange = "30d";
let currentTab = "company";
let grokApiKey = "";          // stored in memory only (no localStorage)
let lastFilteredSnapshot = null; // for Grok context

// ─── Helpers ──────────────────────────────────────────────
function cleanName(raw) {
  raw = (raw || "").trim();
  if (!raw) return raw;
  if (KNOWN_NAMES.includes(raw)) return raw;
  for (const n of NAMES_BY_LEN) { if (raw.endsWith(n)) return n; }
  return raw;
}

function parseFeel(raw) {
  const f = (raw || "").toLowerCase();
  if (f.includes("not good") || f.includes("red_circle") || f.includes("cranky")) return "Not good";
  if (f.includes("great") || f.includes("sunshine") || f.includes("kiwi")) return "Great";
  return "Fine";
}

function parseSleep(raw) {
  const m = (raw || "").match(/(\d+(?:\.\d+)?)/);
  if (!m) return null;
  let v = parseFloat(m[1]);
  if (v > 10) v /= 10;
  if (v > 10) return null;
  return Math.round(v * 10) / 10;
}

function parseDate(raw) {
  const p = (raw || "").trim().split("/");
  if (p.length !== 3) return null;
  const [d, m, y] = p;
  if (!y || y.length !== 4) return null;
  return `${y}-${m.padStart(2,"0")}-${d.padStart(2,"0")}`;
}

function avg(arr) {
  const v = arr.filter(x => x != null);
  return v.length ? v.reduce((a,b) => a+b, 0) / v.length : null;
}

function fmt(n, dp=1) { return n != null ? n.toFixed(dp) : "—"; }
function moodScore(f) { return f === "Great" ? 3 : f === "Fine" ? 2 : 1; }
function moodEmoji(f) { return f === "Great" ? "🟢 Great" : f === "Fine" ? "🟡 Fine" : "🔴 Not good"; }
function moodCls(f) { return f === "Great" ? "great" : f === "Fine" ? "fine" : "bad"; }
function pillCls(f) { return f === "Great" ? "pill-great" : f === "Fine" ? "pill-fine" : "pill-bad"; }
function getMon(ds) {
  const d = new Date(ds + "T00:00:00"), day = d.getDay() || 7;
  return new Date(d - (day-1)*86400000).toISOString().slice(0,10);
}
function dc(id) { const c = Chart.getChart(id); if (c) c.destroy(); }

function getAppreciated(data) {
  const lk = {};
  for (const n of KNOWN_NAMES) {
    lk[n.toLowerCase()] = n;
    const first = n.split(" ")[0].toLowerCase();
    if (first.length >= 3) lk[first] = n;
  }
  Object.assign(lk, { "donne":"Donné Norman","donné":"Donné Norman","des":"Desiree Cagalitan-Olaso","vilecha":"Vilécha Morton","kj":"KJ Chang","kat":"Katalina Sanabria" });
  const cnt = {};
  for (const e of data) {
    if (!e.g) continue;
    for (const [k, full] of Object.entries(lk)) {
      if (k.length < 2 || full === e.n) continue;
      if (new RegExp("\\b" + k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "\\b","i").test(e.g))
        cnt[full] = (cnt[full] || 0) + 1;
    }
  }
  return Object.entries(cnt).sort((a,b) => b[1]-a[1]).slice(0,8);
}

// ─── Data loading (no Netlify — fetches Google Sheets directly) ───
async function loadData() {
  const btn = document.getElementById("refreshBtn");
  btn.classList.add("spinning");

  let csvText = null;

  // 1. Try fetching directly from Google (works when sheet is publicly shared)
  try {
    const res = await fetch(SHEET_URL, { signal: AbortSignal.timeout(8000) });
    if (res.ok) {
      csvText = await res.text();
      // Google sometimes returns an HTML error page — detect that
      if (csvText.trim().startsWith("<!")) throw new Error("Got HTML instead of CSV");
    }
  } catch (e) {
    csvText = null;
  }

  // 2. Fall back to free CORS proxy (corsproxy.io — no account, no credits)
  if (!csvText) {
    try {
      const res = await fetch(PROXY_URL, { signal: AbortSignal.timeout(12000) });
      if (!res.ok) throw new Error(`Proxy returned ${res.status}`);
      csvText = await res.text();
    } catch (e) {
      document.getElementById("statusBar").textContent = `Error: Could not fetch sheet — ${e.message}`;
      document.getElementById("companyView").innerHTML =
        `<div class="err-box">❌ Failed to load data: ${e.message}<br><small>Make sure the Google Sheet is shared as "Anyone with the link can view."</small></div>`;
      btn.classList.remove("spinning");
      return;
    }
  }

  try {
    const parsed = Papa.parse(csvText, {
      header: true,
      skipEmptyLines: true,
      transformHeader: h => h.trim()
    });

    if (parsed.errors.length && !parsed.data.length) {
      throw new Error("Could not parse CSV from Google Sheets.");
    }

    allData = parsed.data
      .map(row => {
        const name = cleanName(row["Name"] || row["name"] || row["NAME"] || "");
        const date = parseDate(row["Date"] || row["date"] || row["DATE"] || "");
        const feeling = parseFeel(row["Feeling"] || row["feeling"] || row["Mood"] || "");
        const sleep = parseSleep(row["Sleep Score"] || row["Sleep"] || row["sleep"] || row["SLEEP"] || "");
        const gratitude = (row["Gratitude Tag"] || row["Gratitude"] || row["gratitude"] || row["Notes"] || "").trim().slice(0, 400);
        return { n: name, d: date, f: feeling, s: sleep, g: gratitude };
      })
      .filter(r => r.n && r.d);

    allData.sort((a,b) => a.d.localeCompare(b.d));

    if (!allData.length) throw new Error("Sheet parsed successfully but no rows found.");

    const names = [...new Set(allData.map(e => e.n))].sort();
    const sel = document.getElementById("memberSel");
    const prev = sel.value;
    sel.innerHTML = '<option value="">— Select a team member —</option>';
    for (const n of names) {
      const o = document.createElement("option");
      o.value = n; o.textContent = n;
      if (n === prev) o.selected = true;
      sel.appendChild(o);
    }

    const last = allData[allData.length - 1].d;
    const first = allData[0].d;
    document.getElementById("statusBar").textContent =
      `${allData.length.toLocaleString()} submissions · ${names.length} members · ${first} → ${last} · Updated ${new Date().toLocaleTimeString()}`;

    applyFilter();
  } catch (err) {
    document.getElementById("statusBar").textContent = `Error: ${err.message}`;
    document.getElementById("companyView").innerHTML =
      `<div class="err-box">❌ Failed to load data: ${err.message}</div>`;
  } finally {
    btn.classList.remove("spinning");
  }
}

// ─── Grok AI ──────────────────────────────────────────────
function toggleGrokPanel() {
  const panel = document.getElementById("grokPanel");
  if (!panel) return;
  panel.classList.toggle("visible");
  if (panel.classList.contains("visible") && grokApiKey) {
    document.getElementById("grokKeyInput").value = grokApiKey;
  }
}

function buildDataSummary(data) {
  const names = [...new Set(allData.map(e => e.n))];
  const total = data.length;
  const great = data.filter(e => e.f === "Great").length;
  const fine  = data.filter(e => e.f === "Fine").length;
  const bad   = data.filter(e => e.f === "Not good").length;
  const slAvg = avg(data.filter(e => e.s != null).map(e => e.s));
  const days  = [...new Set(data.map(e => e.d))];
  const rate  = days.length ? Math.round(total / (days.length * names.length) * 100) : 0;
  const appr  = getAppreciated(data);

  const last5 = [...days].sort().reverse().slice(0, 5);
  const recent = new Set(data.filter(e => last5.includes(e.d)).map(e => e.n));
  const absent = names.filter(n => !recent.has(n));

  // Sample 15 recent gratitude entries for Grok context
  const gratitudeSamples = data
    .filter(e => e.g && e.g.length > 10)
    .slice(-15)
    .map(e => `- ${e.n} (${e.d}): "${e.g.slice(0, 120)}"`)
    .join("\n");

  return `
Team size: ${names.length} members
Date range: ${data[0]?.d || "—"} to ${data[data.length-1]?.d || "—"}
Total submissions: ${total} over ${days.length} active days
Participation rate: ${rate}% (avg submissions per member per day)

Mood breakdown:
  Great: ${great} (${Math.round(great/total*100)}%)
  Fine: ${fine} (${Math.round(fine/total*100)}%)
  Not good: ${bad} (${Math.round(bad/total*100)}%)

Average sleep score: ${slAvg != null ? fmt(slAvg) + "/10" : "no data"}

Most appreciated team members (gratitude mentions):
${appr.slice(0,5).map(([n,c]) => `  ${n}: ${c} mentions`).join("\n") || "  No data"}

Members who haven't submitted in the last 5 active days (${absent.length}):
${absent.length ? absent.join(", ") : "None — everyone submitted"}

Recent gratitude entries (sample):
${gratitudeSamples || "No entries"}
`.trim();
}

async function runGrokInsights() {
  const keyInput = document.getElementById("grokKeyInput");
  const key = keyInput.value.trim();
  if (!key) { keyInput.focus(); return; }
  grokApiKey = key; // keep in memory for this session

  const genBtn = document.getElementById("grokGenBtn");
  const resultEl = document.getElementById("grokResult");

  genBtn.disabled = true;
  genBtn.textContent = "Generating…";
  resultEl.innerHTML = '<span class="ai-spin"></span> Asking Grok…';

  const summary = buildDataSummary(filtered.length ? filtered : allData);

  try {
    const res = await fetch("https://api.x.ai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${key}`
      },
      body: JSON.stringify({
        model: "grok-3-mini",
        messages: [
          {
            role: "system",
            content: "You are a People Operations analyst for Manta Sleep, a fast-growing ecommerce company. Analyze team standup data and respond with 4–5 concise, actionable bullet-point insights for the People Ops Manager. Be specific, practical, and focus on wellbeing, engagement, and team health. Use plain language. No preamble, just the bullets."
          },
          {
            role: "user",
            content: `Here is the standup data summary for the selected period:\n\n${summary}\n\nProvide 4–5 People Ops insights based on this data.`
          }
        ],
        max_tokens: 500,
        temperature: 0.4
      })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || `API error ${res.status}`);
    }

    const json = await res.json();
    const text = json.choices?.[0]?.message?.content || "No response.";

    // Format bullets nicely
    const formatted = text
      .split("\n")
      .map(line => line.trim())
      .filter(Boolean)
      .map(line => `<p style="margin-bottom:8px">${line.replace(/^\*+|-/, "•")}</p>`)
      .join("");

    resultEl.innerHTML = `<div style="padding-top:4px">${formatted}</div>`;

  } catch (err) {
    resultEl.innerHTML = `<span style="color:#dc2626">❌ ${err.message}</span>`;
  } finally {
    genBtn.disabled = false;
    genBtn.textContent = "Generate";
  }
}

// ─── Filtering ────────────────────────────────────────────
function setRange(r) {
  currentRange = r;
  document.querySelectorAll(".range-btn").forEach((b,i) =>
    b.classList.toggle("active", ["7d","30d","90d","all"][i] === r));
  applyFilter();
}

function applyFilter() {
  const days = { "7d":7, "30d":30, "90d":90 }[currentRange];
  const cut = days
    ? new Date(Date.now() - days * 86400000).toISOString().slice(0,10)
    : "2000-01-01";
  filtered = allData.filter(e => e.d >= cut);
  renderTab();
}

function renderTab() {
  if (currentTab === "company") renderCompany(filtered);
  else {
    const sel = document.getElementById("memberSel");
    if (sel.value) renderIndividual(sel.value);
  }
}

function switchTab(t) {
  currentTab = t;
  document.querySelectorAll(".tab-btn").forEach((b,i) =>
    b.classList.toggle("active", i === (t === "company" ? 0 : 1)));
  document.getElementById("companyView").style.display = t === "company" ? "block" : "none";
  document.getElementById("individualView").style.display = t === "individual" ? "block" : "none";
  if (t === "company") renderCompany(filtered);
}

// ─── Company view ─────────────────────────────────────────
function renderCompany(data) {
  if (!data.length) {
    document.getElementById("companyView").innerHTML =
      `<div class="err-box">No data found for this date range.</div>`;
    return;
  }

  const names = [...new Set(allData.map(e => e.n))].sort();
  const total = data.length;
  const great = data.filter(e => e.f === "Great").length;
  const fine  = data.filter(e => e.f === "Fine").length;
  const bad   = data.filter(e => e.f === "Not good").length;
  const slAvg = avg(data.filter(e => e.s != null).map(e => e.s));
  const days  = [...new Set(data.map(e => e.d))];
  const rate  = days.length ? Math.round(total / (days.length * names.length) * 100) : 0;
  const dom   = great >= fine && great >= bad ? "Great" : fine >= bad ? "Fine" : "Not good";
  const rateCol = rate >= 80 ? "#16a34a" : rate >= 60 ? "#d97706" : "#dc2626";

  const wkMap = {};
  for (const e of data) {
    const w = getMon(e.d);
    if (!wkMap[w]) wkMap[w] = { great:0, fine:0, bad:0, sl:[], cnt:0 };
    if (e.f === "Great") wkMap[w].great++;
    else if (e.f === "Fine") wkMap[w].fine++;
    else wkMap[w].bad++;
    if (e.s != null) wkMap[w].sl.push(e.s);
    wkMap[w].cnt++;
  }
  const wks = Object.keys(wkMap).sort().slice(-12);

  const last5 = [...days].sort().reverse().slice(0, 5);
  const recent = new Set(data.filter(e => last5.includes(e.d)).map(e => e.n));
  const absent = names.filter(n => !recent.has(n));
  const appr = getAppreciated(data);

  // Preserve Grok panel state if already open
  const grokPanelOpen = document.getElementById("grokPanel")?.classList.contains("visible");
  const grokPanelKey  = document.getElementById("grokKeyInput")?.value || grokApiKey;
  const grokResult    = document.getElementById("grokResult")?.innerHTML || "";

  document.getElementById("companyView").innerHTML = `
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Submissions</div>
        <div class="stat-value">${total.toLocaleString()}</div>
        <div class="stat-sub">${days.length} days · ${names.length} members</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Dominant Mood</div>
        <div class="stat-value ${moodCls(dom)}" style="font-size:19px">${moodEmoji(dom)}</div>
        <div class="stat-sub">🟢 ${great} &nbsp;🟡 ${fine} &nbsp;🔴 ${bad}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Avg Sleep Score</div>
        <div class="stat-value indigo">${fmt(slAvg)}<span style="font-size:15px;color:#94a3b8">/10</span></div>
        <div class="stat-sub">${data.filter(e=>e.s!=null).length} scores recorded</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Participation Rate</div>
        <div class="stat-value" style="color:${rateCol}">${rate}%</div>
        <div class="stat-sub">avg submissions/member/day</div>
      </div>
    </div>
    <div class="charts-row">
      <div class="chart-card">
        <div class="card-title">Team Mood by Week</div>
        <canvas id="moodC" height="120"></canvas>
      </div>
      <div class="chart-card">
        <div class="card-title">Avg Sleep Score by Week</div>
        <canvas id="sleepC" height="120"></canvas>
      </div>
    </div>
    <div class="bottom-row">
      <div class="chart-card">
        <div class="card-title">💛 Most Appreciated (${currentRange === "all" ? "all time" : currentRange})</div>
        ${appr.length
          ? `<ul>${appr.map(([n,c],i) => `<li class="list-item"><span>${["🏆","🥈","🥉"][i]||""} ${n}</span><span class="badge-pill">${c} mention${c!==1?"s":""}</span></li>`).join("")}</ul>`
          : `<p style="color:#94a3b8;font-size:13px;padding:12px 0">No data in this range.</p>`}
      </div>
      <div class="chart-card">
        <div class="card-title">⚠️ Haven't Submitted Recently</div>
        ${absent.length === 0
          ? `<p style="color:#16a34a;font-size:13px;padding:12px 0">🎉 Everyone submitted in the last 5 active days!</p>`
          : `<ul>${absent.slice(0,10).map(n => `<li class="alert-row"><span class="dot ${absent.length > 8 ? "dot-red" : "dot-amber"}"></span>${n}</li>`).join("")}${absent.length>10?`<li style="color:#94a3b8;font-size:12px;padding:6px 0">+${absent.length-10} more</li>`:""}</ul>`}
      </div>
    </div>

    <!-- ✨ AI + Rule-based Insights Card -->
    <div class="insights-card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <div class="card-title" style="margin-bottom:0">📊 Insights</div>
        <button class="ai-btn" onclick="toggleGrokPanel()" title="Generate AI insights using Grok">
          ✨ AI Insights (Grok)
        </button>
      </div>

      <!-- Grok panel — hidden until the button is clicked -->
      <div class="grok-panel${grokPanelOpen ? " visible" : ""}" id="grokPanel">
        <div class="grok-panel-row">
          <input
            type="password"
            id="grokKeyInput"
            placeholder="xAI API key  (xai-...)"
            value="${grokPanelKey}"
            onkeydown="if(event.key==='Enter')runGrokInsights()"
          />
          <button class="gen-btn" id="grokGenBtn" onclick="runGrokInsights()">Generate</button>
        </div>
        <div class="grok-hint">Uses <strong>grok-3-mini</strong> — minimal tokens, lowest cost. Get a free key at <a href="https://console.x.ai" target="_blank" style="color:#a855f7">console.x.ai</a>.</div>
        <div class="ai-result" id="grokResult">${grokResult}</div>
      </div>

      <!-- Rule-based insights (always shown) -->
      <div id="insightsBody" class="insights-body"></div>
    </div>`;

  // Mood chart
  dc("moodC");
  new Chart(document.getElementById("moodC"), {
    type: "bar",
    data: {
      labels: wks.map(w => w.slice(5)),
      datasets: [
        { label:"Great", data: wks.map(w=>wkMap[w].great), backgroundColor:"#86efac" },
        { label:"Fine",  data: wks.map(w=>wkMap[w].fine),  backgroundColor:"#fde68a" },
        { label:"Not good", data: wks.map(w=>wkMap[w].bad), backgroundColor:"#fca5a5" }
      ]
    },
    options: { responsive:true, maintainAspectRatio:true, plugins:{legend:{labels:{color:"#64748b",boxWidth:12,font:{size:11}}}}, scales:{x:{stacked:true,ticks:{color:"#94a3b8",font:{size:10}},grid:{display:false}},y:{stacked:true,ticks:{color:"#94a3b8",font:{size:10}},grid:{color:"#f1f5f9"}}} }
  });

  // Sleep chart
  dc("sleepC");
  new Chart(document.getElementById("sleepC"), {
    type: "line",
    data: {
      labels: wks.map(w => w.slice(5)),
      datasets: [{ data: wks.map(w => { const v = avg(wkMap[w].sl); return v != null ? parseFloat(v.toFixed(1)) : null; }), borderColor:"#6366f1", backgroundColor:"rgba(99,102,241,0.08)", pointBackgroundColor:"#6366f1", tension:0.3, fill:true, spanGaps:true, pointRadius:4 }]
    },
    options: { responsive:true, maintainAspectRatio:true, plugins:{legend:{display:false}}, scales:{x:{ticks:{color:"#94a3b8",font:{size:10}},grid:{display:false}},y:{min:4,max:10,ticks:{color:"#94a3b8",font:{size:10}},grid:{color:"#f1f5f9"}}} }
  });

  // Rule-based insights (fast, no API)
  const el = document.getElementById("insightsBody");
  const pct = n => Math.round(n / total * 100);
  const gPct = pct(great), bPct = pct(bad);
  let html = "";
  html += `<p><strong>Mood:</strong> ${gPct}% Great, ${pct(fine)}% Fine, ${bPct}% Not good${bPct >= 15 ? " — consider a team check-in" : ""}.</p>`;
  if (slAvg) html += `<p><strong>Sleep:</strong> Team averaging ${fmt(slAvg)}/10${slAvg < 6 ? " — notably low, worth raising with the team" : slAvg >= 7.5 ? " — the team is well-rested" : ""}.</p>`;
  html += `<p><strong>Participation:</strong> ${rate}% rate across ${days.length} days${absent.length > 0 ? ` — ${absent.length} member${absent.length !== 1 ? "s" : ""} haven't submitted recently (${absent.slice(0,3).join(", ")}${absent.length > 3 ? "…" : ""})` : " — great engagement"}.</p>`;
  if (appr.length) html += `<p><strong>Recognition:</strong> ${appr[0][0]} leads in gratitude mentions (${appr[0][1]}×)${appr[1] ? `, followed by ${appr[1][0]} (${appr[1][1]}×)` : ""} — strong appreciation culture.</p>`;
  el.innerHTML = html;
}

// ─── Individual view ──────────────────────────────────────
function renderIndividual(name) {
  if (!name) return;
  const pd = allData.filter(e => e.n === name).sort((a,b) => a.d.localeCompare(b.d));
  if (!pd.length) {
    document.getElementById("indContent").innerHTML = `<div style="color:#94a3b8;font-size:13px;padding:24px">No data found for ${name}.</div>`;
    return;
  }

  const slAvg = avg(pd.filter(e => e.s != null).map(e => e.s));
  const mAvg  = avg(pd.map(e => moodScore(e.f)));
  const dom   = mAvg >= 2.5 ? "Great" : mAvg >= 1.5 ? "Fine" : "Not good";

  const udates = [...new Set(pd.map(e => e.d))].sort().reverse();
  let streak = 0;
  for (let i = 0; i < udates.length; i++) {
    if (i === 0) { streak = 1; continue; }
    const diff = Math.round((new Date(udates[i-1]+"T00:00:00") - new Date(udates[i]+"T00:00:00")) / 86400000);
    if (diff <= 3) streak++; else break;
  }

  const cd = pd.slice(-30);

  document.getElementById("indContent").innerHTML = `
    <div class="ind-grid">
      <div class="stat-card"><div class="stat-label">Total Submissions</div><div class="stat-value">${pd.length}</div><div class="stat-sub">since ${pd[0].d.slice(5)} · ${streak}-day streak</div></div>
      <div class="stat-card"><div class="stat-label">Overall Mood</div><div class="stat-value ${moodCls(dom)}" style="font-size:18px">${moodEmoji(dom)}</div><div class="stat-sub">avg ${fmt(mAvg)} / 3.0</div></div>
      <div class="stat-card"><div class="stat-label">Avg Sleep</div><div class="stat-value indigo" style="font-size:26px">${fmt(slAvg)}<span style="font-size:14px;color:#94a3b8">/10</span></div><div class="stat-sub">${pd.filter(e=>e.s!=null).length} scores recorded</div></div>
    </div>
    <div class="p-charts">
      <div class="chart-card"><div class="card-title">Mood — last 30 entries</div><canvas id="pMood" height="140"></canvas></div>
      <div class="chart-card"><div class="card-title">Sleep — last 30 entries</div><canvas id="pSleep" height="140"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="card-title">Recent Entries</div>
      <table class="tbl">
        <thead><tr><th>Date</th><th>Mood</th><th>Sleep</th><th>Gratitude</th></tr></thead>
        <tbody>${[...pd].reverse().slice(0,20).map(e => `
          <tr>
            <td>${e.d.slice(5)}</td>
            <td><span class="pill ${pillCls(e.f)}">${e.f}</span></td>
            <td>${e.s != null ? e.s + "/10" : "—"}</td>
            <td style="max-width:340px;color:#64748b;font-size:12px">${(e.g||"").slice(0,160)}</td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>`;

  dc("pMood");
  new Chart(document.getElementById("pMood"), {
    type: "line",
    data: { labels: cd.map(e=>e.d.slice(5)), datasets: [{ data: cd.map(e=>moodScore(e.f)), borderColor:"#6366f1", backgroundColor:"rgba(99,102,241,0.07)", pointBackgroundColor: cd.map(e=>e.f==="Great"?"#16a34a":e.f==="Fine"?"#d97706":"#dc2626"), pointRadius:5, tension:0.3, fill:true, spanGaps:true }] },
    options: { responsive:true, maintainAspectRatio:true, plugins:{legend:{display:false}}, scales:{x:{ticks:{color:"#94a3b8",font:{size:10},maxRotation:45},grid:{display:false}},y:{min:0.5,max:3.5,ticks:{color:"#94a3b8",font:{size:10},stepSize:1,callback:v=>({1:"🔴",2:"🟡",3:"🟢"}[v]||"")},grid:{color:"#f1f5f9"}}} }
  });

  dc("pSleep");
  new Chart(document.getElementById("pSleep"), {
    type: "line",
    data: { labels: cd.map(e=>e.d.slice(5)), datasets: [{ data: cd.map(e=>e.s), borderColor:"#16a34a", backgroundColor:"rgba(22,163,74,0.07)", pointBackgroundColor:"#16a34a", pointRadius:5, tension:0.3, fill:true, spanGaps:true }] },
    options: { responsive:true, maintainAspectRatio:true, plugins:{legend:{display:false}}, scales:{x:{ticks:{color:"#94a3b8",font:{size:10},maxRotation:45},grid:{display:false}},y:{min:1,max:10,ticks:{color:"#94a3b8",font:{size:10}},grid:{color:"#f1f5f9"}}} }
  });
}

// ─── Init ─────────────────────────────────────────────────
loadData();
</script>
</body>
</html>
